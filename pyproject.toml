[project]
name = "discord-skill"
version = "0.1.0"
description = "Claude Code plugin: Send Discord notifications with rich embeds and receive responses"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3",
    "pydantic>=2.0,<3",
]

[project.scripts]
discord-notify = "discord_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/discord_bot"]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
